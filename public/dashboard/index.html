<!doctype html>

  <meta charset="utf-8">

  <title>TYCHE PPE 실제 데이터 대시보드</title>
  <style>
    :root{color-scheme:dark;--bg:#061018;--panel:#0b1a24;--panel2:#102631;--line:#1d3a48;--text:#edf7f7;--muted:#8aa4ae;--cyan:#63e2dd;--green:#72dca3;--amber:#f3bd72;--red:#ff7d88;--blue:#79a9ff;--radius:16px;--shadow:0 18px 42px rgba(0,0,0,.22)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(53,143,161,.18),transparent 32%),linear-gradient(145deg,#061018,#081720);color:var(--text);font:14px/1.55 Inter,Pretendard,"Noto Sans KR","Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 16px;border-right:1px solid #15303d;background:rgba(4,13,20,.95);display:flex;flex-direction:column}.brand{padding:6px 10px 24px}.brand b{display:block;font-size:16px;letter-spacing:.1em}.brand small{color:var(--cyan);letter-spacing:.12em}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#9bb1b9}.nav button:hover,.nav button.active{background:#102532;color:#fff;border-color:#244b5d}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.source-status{margin-top:auto;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0a1b26;color:var(--muted);font-size:12px}.source-status b{display:block;color:var(--green);margin-bottom:4px}.main{min-width:0;padding:28px clamp(18px,3vw,44px) 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{color:var(--cyan);font-size:12px;font-weight:850;letter-spacing:.15em}h1{margin:7px 0 5px;font-size:clamp(26px,3vw,38px);letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);max-width:760px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#0d202b;border-radius:10px;padding:10px 13px}.btn:hover{border-color:#3c7186}.badge{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(99,226,221,.3);background:rgba(99,226,221,.08);color:var(--cyan);font-size:12px;font-weight:800}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.filters{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;margin:20px 0 14px;padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(9,26,36,.88)}label{display:block;color:#718d98;font-size:12px;font-weight:800;margin:0 0 5px 2px}select,input{width:100%;min-height:40px;border:1px solid #173744;border-radius:10px;background:#071721;padding:0 10px;outline:none}select:focus,input:focus{border-color:var(--cyan)}.scope{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;margin-bottom:20px;border:1px solid #163440;border-radius:12px;color:#9ab2ba;background:rgba(7,21,30,.8)}.scope b{color:var(--cyan)}.view{display:none}.view.active{display:block}.grid{display:grid;gap:13px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.card{min-width:0;padding:17px;border:1px solid #173744;border-radius:var(--radius);background:linear-gradient(150deg,rgba(15,36,48,.97),rgba(8,23,32,.98));box-shadow:var(--shadow)}.card h2{margin:0;font-size:16px}.card-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:14px}.card-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.kpi .label{color:#809aa4;font-size:12px;font-weight:800}.kpi .value{margin:8px 0 3px;font-size:31px;font-weight:850;letter-spacing:-.04em}.kpi .desc{color:var(--muted);font-size:12px;min-height:36px}.good{color:var(--green)!important}.warn{color:var(--amber)!important}.bad{color:var(--red)!important}.muted{color:var(--muted)!important}.spacer{margin-top:13px}.table-wrap{overflow:auto;border:1px solid #173744;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px 11px;border-bottom:1px solid #15323e;text-align:left;vertical-align:top;font-size:12px}th{position:sticky;top:0;background:#081923;color:#738f99;z-index:1}tbody tr:last-child td{border-bottom:0}tbody tr[data-click]{cursor:pointer}tbody tr[data-click]:hover{background:rgba(99,226,221,.05)}.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;padding:3px 7px;border-radius:999px;background:#173846;color:#a9dde0;font-size:11px;font-weight:800}.pill.good{background:rgba(114,220,163,.12)}.pill.warn{background:rgba(243,189,114,.12)}.pill.bad{background:rgba(255,125,136,.12)}.note{padding:11px 12px;border:1px solid #1b3b49;border-left:3px solid var(--cyan);border-radius:10px;background:#091d28;color:#a8bec5;font-size:12px}.note.warn-note{border-left-color:var(--amber)}.empty{padding:24px;text-align:center;color:#718b96}.warning-list{display:grid;gap:9px}.warning{width:100%;text-align:left;border:1px solid #1b3a48;border-radius:11px;background:#091d28;padding:11px}.warning:hover{border-color:#4c7687}.warning b{display:block;margin-bottom:3px}.warning small{color:var(--muted)}.warning.red b{color:var(--red)}.warning.amber b{color:var(--amber)}.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.fact{padding:7px 9px;border:1px solid #193845;border-radius:9px;background:#081a24;color:#9fb6be;font-size:12px}.fact b{color:#fff}.timeline{display:grid;gap:7px}.stage{display:grid;grid-template-columns:12px minmax(150px,1fr) 120px 80px;gap:10px;align-items:center;padding:9px;border:1px solid #163642;border-radius:10px;background:#081c27}.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}.stage small{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 7px;border-radius:8px;border:1px solid #1b3f4d;background:#0a202b;color:#b2c8ce;font-size:11px}.detail-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detail-header h2{font-size:19px}.detail-header select{width:min(380px,48vw)}.metric-bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 80px;gap:10px;align-items:center}.bar{height:9px;border-radius:999px;background:#13313d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#51cbd0,#72dca3)}.error{padding:18px;border:1px solid rgba(255,125,136,.4);border-radius:12px;background:rgba(255,125,136,.08);color:#ffc0c6}.raw-filter{display:grid;grid-template-columns:260px 220px minmax(180px,1fr);gap:9px;margin-bottom:10px}.footer{margin-top:22px;color:#5f7b86;font-size:12px}.mobile-nav{display:none;overflow:auto;gap:7px;margin:16px 0}.mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:#0b202b;border-radius:999px;padding:7px 11px}.mobile-nav button.active{background:var(--cyan);color:#052027}
    @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
    @media(max-width:760px){.app{display:block}.sidebar{display:none}.main{padding:20px 14px 45px}.top{display:block}.actions{margin-top:12px}.mobile-nav{display:flex}.filters{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.raw-filter{grid-template-columns:1fr}.stage{grid-template-columns:12px 1fr}.stage>*:nth-child(n+3){grid-column:2}.scope{display:block}.scope span{display:block}.detail-header{display:block}.detail-header select{width:100%;margin-top:10px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>TYCHE PPE</b><small>REAL DATA VIEW</small></div>
    <nav class="nav" id="desktopNav">
      <button class="active" data-view="overview">전체 개요</button>
      <button data-view="sessions">세션 상세</button>
      <button data-view="people">사용자별 기록</button>
      <button data-view="content">시나리오·PPE</button>
      <button data-view="usability">사용성·그랩</button>
      <button data-view="evidence">원본 이벤트</button>
    </nav>
    <div class="source-status" id="sideStatus"><b>데이터 연결 중</b>로컬 Unity JSONL 읽기 API를 확인하고 있습니다.</div>
  </aside>
  <main class="main">
    <div class="top">
      <div><div class="eyebrow">UNITY → LOCAL API → EVIDENCE</div><h1 id="pageTitle">전체 개요</h1><p class="subtitle" id="pageSubtitle">Unity가 실제로 기록한 세션·단계·PPE·음성 이벤트만 표시합니다.</p><div class="badge" id="dataBadge">데이터 불러오는 중</div></div>
      <div class="actions"><button class="btn" id="refreshButton">새로고침</button></div>
    </div>
    <div class="mobile-nav" id="mobileNav"></div>
    <section class="filters">
      <div><label for="userFilter">META 사용자 ID</label><select id="userFilter"><option value="all">전체</option></select></div>
      <div><label for="modeFilter">모드</label><select id="modeFilter"><option value="all">전체</option></select></div>
      <div><label for="planFilter">시나리오</label><select id="planFilter"><option value="all">전체</option></select></div>
    </section>
    <div class="scope"><span id="scopeText"><b>0개 세션</b></span><span>모든 수치는 원본 이벤트에서 다시 계산됩니다.</span></div>
    <div id="loading" class="card"><div class="empty">실제 세션을 불러오고 있습니다.</div></div>
    <div id="error" class="error" hidden></div>

    <section class="view active" id="view-overview"><div id="overviewContent"></div></section>
    <section class="view" id="view-sessions"><div id="sessionContent"></div></section>
    <section class="view" id="view-people"><div id="peopleContent"></div></section>
    <section class="view" id="view-content"><div id="scenarioPpeContent"></div></section>
    <section class="view" id="view-usability"><div id="usabilityContent"></div></section>
    <section class="view" id="view-evidence"><div id="evidenceContent"></div></section>
    <div class="footer">TYCHE PPE 실제 데이터 대시보드 · 로컬 개발 검증용 · 운영 DB 전환 전</div>
  </main>
</div>
<script>
const hostedDashboardUrl="http://127.0.0.1:3000/dashboard/";
if(window.location.protocol==="file:")window.location.replace(hostedDashboardUrl);
const pages={overview:["전체 개요","실제 세션 수, 식별 상태, 완료 관찰과 데이터 품질을 확인합니다."],sessions:["세션 상세","한 회차의 단계·PPE·음성·종료 원본을 함께 봅니다."],people:["사용자별 기록","Meta 앱 범위 사용자 ID에서 세션·시나리오·PPE 수행으로 내려갑니다."],content:["시나리오·PPE","시나리오별 필수 PPE와 개별 장비 결과를 원본 이벤트로 비교합니다."],usability:["사용성·그랩","음성 재생과 새 그랩 계측의 측정 여부·실패 근거를 확인합니다."],evidence:["원본 이벤트","요약값의 근거가 되는 JSONL 이벤트를 직접 조회합니다."]};
const state={sessions:[],view:"overview",user:"all",mode:"all",plan:"all",selectedSession:null,evidenceSession:"all",evidenceType:"all",evidenceSearch:""};
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const fmtTime=v=>v?new Intl.DateTimeFormat("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date(v)):"—";
const seconds=v=>Number.isFinite(v)?(v<60?`${v.toFixed(1)}초`:`${Math.floor(v/60)}분 ${(v%60).toFixed(0)}초`):"—";
const duration=(a,b)=>a&&b?Math.max(0,(new Date(b)-new Date(a))/1000):null;
const uniq=a=>[...new Set(a.filter(v=>v!==null&&v!==undefined&&v!==""))];
const median=a=>{const v=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!v.length)return null;const m=Math.floor(v.length/2);return v.length%2?v[m]:(v[m-1]+v[m])/2};
const pill=(text,tone="")=>`<span class="pill ${tone}">${esc(text)}</span>`;
function allEvents(items){return items.flatMap(s=>s.events.map(e=>({...e,_session:s.summary})));}
function allParseErrors(items){return items.flatMap(s=>(s.parseErrors||[]).map(error=>({...error,_session:s.summary})));}
function filtered(){return state.sessions.filter(({summary})=>(state.user==="all"||(state.user==="unknown"?!summary.metaUserId:summary.metaUserId===state.user))&&(state.mode==="all"||summary.modes.includes(state.mode))&&(state.plan==="all"||summary.workPlans.includes(state.plan)));}
function optionList(select,values,label=v=>v){const current=select.value;select.innerHTML='<option value="all">전체</option>'+values.map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join("");if([...select.options].some(o=>o.value===current))select.value=current;}
async function load(){ $("loading").hidden=false;$("error").hidden=true;try{const listResponse=await fetch("/api/local-telemetry/sessions",{cache:"no-store"});if(!listResponse.ok)throw new Error(`세션 목록 HTTP ${listResponse.status}`);const list=(await listResponse.json()).data||[];const details=await Promise.all(list.map(async row=>{const r=await fetch(`/api/local-telemetry/sessions/${encodeURIComponent(row.sessionId)}`,{cache:"no-store"});if(!r.ok)throw new Error(`${row.sessionId} 조회 HTTP ${r.status}`);return (await r.json()).data;}));state.sessions=details;state.selectedSession=details.some(s=>s.summary.sessionId===state.selectedSession)?state.selectedSession:details[0]?.summary.sessionId||null;setupFilters();render();const invalid=details.reduce((n,s)=>n+s.summary.invalidLineCount,0);$("sideStatus").innerHTML=`<b>실제 JSONL 연결</b>${details.length}개 세션 · 유효 이벤트 ${details.reduce((n,s)=>n+s.summary.eventCount,0)}건 · 파싱 오류 ${invalid}건`;$("dataBadge").textContent=`LOCAL JSONL · ${details.length}개 세션 · 오류 ${invalid}건`;}catch(error){$("error").hidden=false;$("error").textContent=`데이터를 불러오지 못했습니다: ${error.message}`;$("dataBadge").textContent="API 연결 실패";}finally{$("loading").hidden=true;}}
function setupFilters(){const users=uniq(state.sessions.map(s=>s.summary.metaUserId));optionList($("userFilter"),users);if(state.sessions.some(s=>!s.summary.metaUserId))$("userFilter").insertAdjacentHTML("beforeend",'<option value="unknown">미식별 세션</option>');optionList($("modeFilter"),uniq(state.sessions.flatMap(s=>s.summary.modes)));optionList($("planFilter"),uniq(state.sessions.flatMap(s=>s.summary.workPlans)));$("userFilter").value=state.user;$("modeFilter").value=state.mode;$("planFilter").value=state.plan;}
function kpi(label,value,desc,tone=""){return `<article class="card kpi"><div class="label">${label}</div><div class="value ${tone}">${value}</div><div class="desc">${desc}</div></article>`;}
function sessionStatus(s){if(s.courseCompleted)return pill("과정 Completed 관찰","good");if(s.endedAt)return pill("완료 전 종료","warn");return pill("종료 이벤트 없음","");}
function renderOverview(items){const events=allEvents(items),users=uniq(items.map(s=>s.summary.metaUserId)),completed=items.filter(s=>s.summary.courseCompleted).length,endedEarly=items.filter(s=>s.summary.endedAt&&!s.summary.courseCompleted).length,invalid=items.reduce((n,s)=>n+s.summary.invalidLineCount,0),unidentified=items.filter(s=>!s.summary.metaUserId).length,grabSessions=items.filter(s=>s.summary.grabAttemptCount>0).length;const warnings=[{n:invalid,title:"JSON 파싱 오류",desc:invalid?`무효 행 ${invalid}건을 확인해야 합니다.`:"현재 필터에서 무효 JSON 행이 없습니다.",tone:invalid?"red":"",type:"invalid"},{n:unidentified,title:"사용자 ID 미식별 세션",desc:unidentified?`${unidentified}개 세션은 Meta ID와 연결되지 않았습니다.`:"모든 표시 세션에 Meta ID가 있습니다.",tone:unidentified?"amber":"",type:"identity"},{n:endedEarly,title:"완료 전 종료 세션",desc:`Completed 상태가 관찰되지 않은 종료 ${endedEarly}건입니다. 종료 이유는 확정하지 않습니다.`,tone:endedEarly?"amber":"",type:"ended"},{n:grabSessions,title:"그랩 계측 포함 세션",desc:grabSessions?`${grabSessions}개 세션에서 원본 Grip 시도가 수집됐습니다.`:"현재 저장된 세션은 그랩 계측 추가 이전 기록입니다.",tone:"",type:"grab"}];$("overviewContent").innerHTML=`<div class="grid kpis">${kpi("시작 세션",items.length,"session_started로 생성된 실제 회차")}${kpi("식별된 사용자",users.length,`Meta 앱 범위 ID · 미식별 ${unidentified}세션`,unidentified?"warn":"good")}${kpi("과정 완료 관찰",completed,`flowState=Completed가 실제 기록된 세션`,completed?"good":"muted")}${kpi("완료 전 종료",endedEarly,"종료 원인은 application_quitting만으로 확정하지 않음",endedEarly?"warn":"good")}</div><div class="grid two spacer"><article class="card"><div class="card-head"><div><h2>최근 세션</h2><p>행을 누르면 단계·PPE·음성 원본으로 이동합니다.</p></div></div>${sessionTable(items.slice(0,8))}</article><article class="card"><div class="card-head"><div><h2>검토 신호</h2><p>숫자를 누르면 관련 원본 이벤트로 이동합니다.</p></div></div><div class="warning-list">${warnings.map(w=>`<button class="warning ${w.tone}" data-warning="${w.type}"><b>${esc(w.title)} · ${w.n}</b><small>${esc(w.desc)}</small></button>`).join("")}</div></article></div><article class="card spacer"><div class="card-head"><div><h2>데이터 품질</h2><p>목업 수치가 아니라 현재 필터의 실제 파일 상태입니다.</p></div></div><div class="facts"><span class="fact">유효 이벤트 <b>${events.length}</b></span><span class="fact">파싱 오류 <b>${invalid}</b></span><span class="fact">PPE 선택 결과 <b>${events.filter(e=>e.eventType==="ppe_choice_resolved").length}</b></span><span class="fact">음성 종료 기록 <b>${events.filter(e=>e.eventType==="voice_playback_ended").length}</b></span><span class="fact">Grab 시도 <b>${grabSessions?events.filter(e=>e.eventType==="ppe_grab_attempted").length:"미계측"}</b></span></div></article>`;bindWarnings();bindSessionRows();}
function sessionTable(items){return `<div class="table-wrap"><table><thead><tr><th>시작</th><th>Meta 사용자</th><th>모드</th><th>시나리오</th><th>마지막 단계</th><th>필수 PPE</th><th>종료</th><th class="num">이벤트</th></tr></thead><tbody>${items.length?items.map(s=>`<tr data-click="session" data-id="${esc(s.summary.sessionId)}"><td>${fmtTime(s.summary.startedAt)}</td><td>${esc(s.summary.metaUserId||"미식별")}</td><td>${esc(s.summary.modes.join(", ")||"—")}</td><td>${esc(s.summary.workPlans.join(", ")||"미선택")}</td><td>${esc(s.summary.lastFlowState||"—")}</td><td>${s.summary.requiredPpeCompleted?pill("complete","good"):pill("complete 미관찰","warn")}</td><td>${sessionStatus(s.summary)}</td><td class="num">${s.summary.eventCount}</td></tr>`).join(""):`<tr><td colspan="8" class="empty">조건에 맞는 세션이 없습니다.</td></tr>`}</tbody></table></div>`;}
function stages(session){const transitions=session.events.filter(e=>e.eventType==="flow_state_changed");const ended=session.events.findLast(e=>e.eventType==="session_ended");return transitions.map((e,i)=>({event:e,end:transitions[i+1]?.timestampUtc||ended?.timestampUtc||null,sec:duration(e.timestampUtc,transitions[i+1]?.timestampUtc||ended?.timestampUtc)}));}
function requiredItems(session){const byPlan={};for(const e of session.events){if(!e.workPlan||e.workPlan==="None"||!e.missingRequiredPpe)continue;byPlan[e.workPlan]??=new Set();e.missingRequiredPpe.split(",").filter(Boolean).forEach(x=>byPlan[e.workPlan].add(x));}return byPlan;}
function inspectionDurations(events,item){const starts=[];const values=[];for(const e of events.filter(x=>x.itemType===item&&(x.eventType==="ppe_inspection_started"||x.eventType==="ppe_inspection_stopped"))){if(e.eventType==="ppe_inspection_started")starts.push(e.timestampUtc);else if(starts.length)values.push(duration(starts.shift(),e.timestampUtc));}return values;}
function renderSession(items){let session=items.find(s=>s.summary.sessionId===state.selectedSession)||items[0];if(!session){$("sessionContent").innerHTML='<div class="card empty">조건에 맞는 세션이 없습니다.</div>';return;}state.selectedSession=session.summary.sessionId;const s=session.summary,ev=session.events,stageRows=stages(session),itemsSeen=uniq(ev.map(e=>e.itemType)),req=requiredItems(session);const ppeRows=itemsSeen.map(item=>{const rows=ev.filter(e=>e.itemType===item),choices=rows.filter(e=>e.eventType==="ppe_choice_resolved"),grab=rows.filter(e=>e.eventType==="ppe_grab_attempted"),outcomes=rows.filter(e=>e.eventType==="ppe_grab_attempt_resolved"),d=inspectionDurations(ev,item);const plans=Object.entries(req).filter(([,set])=>set.has(item)).map(([plan])=>plan);return `<tr><td>${esc(item)}</td><td>${plans.length?plans.map(p=>pill(p)).join(" "):"관찰된 필수 목록 없음"}</td><td class="num">${rows.filter(e=>e.eventType==="ppe_inspection_started").length}</td><td>${choices.map(c=>pill(c.result,c.result==="UseApproved"?"good":"bad")).join(" ")||"—"}</td><td>${grab.length?`${grab.length}회 / ${outcomes.map(o=>esc(o.attemptOutcome)).join(", ")}`:"미계측"}</td><td>${seconds(median(d))}</td></tr>`}).join("");const voice=ev.filter(e=>e.eventType==="voice_playback_ended");$("sessionContent").innerHTML=`<article class="card"><div class="detail-header"><div><h2>세션 ${esc(s.sessionId)}</h2><p class="muted">Meta ID ${esc(s.metaUserId||"미식별")} · 연령 범주 ${esc(s.metaAgeCategory||"Unknown")}</p></div><select id="sessionSelect">${items.map(x=>`<option value="${esc(x.summary.sessionId)}" ${x.summary.sessionId===s.sessionId?"selected":""}>${fmtTime(x.summary.startedAt)} · ${esc(x.summary.workPlans.join(",")||"미선택")}</option>`).join("")}</select></div><div class="facts"><span class="fact">모드 <b>${esc(s.modes.join(", ")||"—")}</b></span><span class="fact">시나리오 <b>${esc(s.workPlans.join(", ")||"미선택")}</b></span><span class="fact">마지막 단계 <b>${esc(s.lastFlowState||"—")}</b></span><span class="fact">종료 <b>${s.endNote==="application_quitting"?"앱 종료 시점 · 원인 미확인":esc(s.endNote||"미기록")}</b></span><span class="fact">파싱 오류 <b>${s.invalidLineCount}</b></span></div></article><article class="card spacer"><div class="card-head"><div><h2>단계별 흐름</h2><p>flow_state_changed 사이의 실제 timestamp 차이입니다.</p></div></div><div class="timeline">${stageRows.map(x=>`<div class="stage"><i class="dot"></i><div><b>${esc(x.event.flowState)}</b><br><small>${esc(x.event.mode||"—")} · ${esc(x.event.workPlan||"None")}</small></div><span>${fmtTime(x.event.timestampUtc)}</span><b>${seconds(x.sec)}</b></div>`).join("")}</div></article><article class="card spacer"><div class="card-head"><div><h2>PPE별 상세</h2><p>검사·선택·필수 목록·그랩 계측을 같은 세션에서 연결합니다.</p></div></div><div class="table-wrap"><table><thead><tr><th>PPE</th><th>필수 시나리오 근거</th><th class="num">검사 시작</th><th>선택 결과</th><th>Grab</th><th>검사시간 중앙값</th></tr></thead><tbody>${ppeRows||'<tr><td colspan="6" class="empty">PPE 이벤트가 없습니다.</td></tr>'}</tbody></table></div></article><article class="card spacer"><div class="card-head"><div><h2>음성 재생 근거</h2><p>클립 길이와 실제 재생시간, 종료 상태입니다.</p></div></div><div class="table-wrap"><table><thead><tr><th>시각</th><th>클립</th><th>종료 상태</th><th class="num">전체 길이</th><th class="num">실제 재생</th></tr></thead><tbody>${voice.map(v=>`<tr><td>${fmtTime(v.timestampUtc)}</td><td>${esc(v.audioClip)}</td><td>${pill(v.note,v.note==="completed"?"good":v.note==="replaced"?"warn":"bad")}</td><td class="num">${seconds(v.audioLengthSec)}</td><td class="num">${seconds(v.audioElapsedSec)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">음성 종료 이벤트가 없습니다.</td></tr>'}</tbody></table></div></article>`;$("sessionSelect").onchange=e=>{state.selectedSession=e.target.value;renderSession(items)};}
function renderPeople(items){const groups=new Map();for(const s of items){const id=s.summary.metaUserId||"미식별";if(!groups.has(id))groups.set(id,[]);groups.get(id).push(s);}$("peopleContent").innerHTML=[...groups].map(([id,rows])=>{const events=allEvents(rows),plans=uniq(rows.flatMap(s=>s.summary.workPlans)),modes=uniq(rows.flatMap(s=>s.summary.modes)),ppe=uniq(events.map(e=>e.itemType));return `<article class="card spacer"><div class="card-head"><div><h2>${esc(id)}</h2><p>Meta 앱 범위 사용자 ID · 연령 ${esc(rows.find(s=>s.summary.metaAgeCategory)?.summary.metaAgeCategory||"Unknown")}</p></div>${pill(`${rows.length}세션`)}</div><div class="facts"><span class="fact">모드 <b>${esc(modes.join(", ")||"—")}</b></span><span class="fact">시나리오 <b>${esc(plans.join(", ")||"미선택")}</b></span><span class="fact">PPE 종류 <b>${ppe.length}</b></span><span class="fact">선택 결과 <b>${events.filter(e=>e.eventType==="ppe_choice_resolved").length}</b></span><span class="fact">과정 완료 관찰 <b>${rows.filter(s=>s.summary.courseCompleted).length}</b></span></div><div class="spacer">${sessionTable(rows)}</div></article>`}).join("")||'<div class="card empty">사용자 기록이 없습니다.</div>';bindSessionRows();}
function renderContent(items){const events=allEvents(items),plans=uniq(events.map(e=>e.workPlan).filter(x=>x!=="None")),planRows=plans.map(plan=>{const pe=events.filter(e=>e.workPlan===plan),sessions=uniq(pe.map(e=>e.sessionId)),choices=pe.filter(e=>e.eventType==="ppe_choice_resolved"),complete=uniq(pe.filter(e=>e.requiredPpeCheck==="complete").map(e=>e.sessionId)).length,req=uniq(pe.flatMap(e=>(e.missingRequiredPpe||"").split(",").filter(Boolean)));return `<tr data-click="evidence-plan" data-plan="${esc(plan)}"><td><b>${esc(plan)}</b></td><td class="num">${sessions.length}</td><td>${req.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")||"필수 목록 미관찰"}</td><td class="num">${choices.filter(e=>e.result==="UseApproved").length}</td><td class="num">${choices.filter(e=>e.result!=="UseApproved").length}</td><td class="num">${complete}</td></tr>`}).join("");const ppeItems=uniq(events.map(e=>e.itemType)).sort(),ppeRows=ppeItems.map(item=>{const rows=events.filter(e=>e.itemType===item),choices=rows.filter(e=>e.eventType==="ppe_choice_resolved"),grab=rows.filter(e=>e.eventType==="ppe_grab_attempted"),resolved=rows.filter(e=>e.eventType==="ppe_grab_attempt_resolved"),d=[];for(const s of items)d.push(...inspectionDurations(s.events,item));return `<tr data-click="evidence-ppe" data-ppe="${esc(item)}"><td><b>${esc(item)}</b></td><td class="num">${rows.filter(e=>e.eventType==="ppe_inspection_started").length}</td><td class="num good">${choices.filter(e=>e.result==="UseApproved").length}</td><td class="num bad">${choices.filter(e=>e.result!=="UseApproved").length}</td><td>${grab.length?`${grab.length} / 성공 ${resolved.filter(e=>e.attemptOutcome==="selected").length} / 실패 ${resolved.filter(e=>e.attemptOutcome!=="selected").length}`:"미계측"}</td><td>${seconds(median(d))}</td></tr>`}).join("");$("scenarioPpeContent").innerHTML=`<article class="card"><div class="card-head"><div><h2>시나리오별 실제 결과</h2><p>초기 missingRequiredPpe 이벤트에서 관찰된 필수 PPE 목록입니다.</p></div></div><div class="table-wrap"><table><thead><tr><th>시나리오</th><th class="num">세션</th><th>관찰된 필수 PPE 전체 목록</th><th class="num">승인</th><th class="num">오염 거부</th><th class="num">필수 PPE complete 세션</th></tr></thead><tbody>${planRows||'<tr><td colspan="6" class="empty">시나리오 데이터가 없습니다.</td></tr>'}</tbody></table></div></article><article class="card spacer"><div class="card-head"><div><h2>개별 PPE 수행</h2><p>행을 누르면 해당 PPE의 원본 이벤트를 확인합니다.</p></div></div><div class="table-wrap"><table><thead><tr><th>PPE</th><th class="num">검사 시작</th><th class="num">사용 승인</th><th class="num">오염 거부</th><th>Grab 시도/결과</th><th>검사시간 중앙값</th></tr></thead><tbody>${ppeRows||'<tr><td colspan="6" class="empty">PPE 데이터가 없습니다.</td></tr>'}</tbody></table></div></article>`;document.querySelectorAll('[data-click="evidence-plan"]').forEach(tr=>tr.onclick=()=>openEvidence("all",tr.dataset.plan));document.querySelectorAll('[data-click="evidence-ppe"]').forEach(tr=>tr.onclick=()=>openEvidence("all",tr.dataset.ppe));}
function renderUsability(items){const events=allEvents(items),attempts=events.filter(e=>e.eventType==="ppe_grab_attempted"),resolved=events.filter(e=>e.eventType==="ppe_grab_attempt_resolved"),grabMeasured=attempts.length>0,voice=events.filter(e=>e.eventType==="voice_playback_ended"),completed=voice.filter(e=>e.note==="completed").length,replaced=voice.filter(e=>e.note==="replaced").length,stopped=voice.filter(e=>e.note==="stopped").length,invalid=items.reduce((n,s)=>n+s.summary.invalidLineCount,0);const outcomes=Object.entries(resolved.reduce((a,e)=>(a[e.attemptOutcome||"unknown"]=(a[e.attemptOutcome||"unknown"]||0)+1,a),{}));$("usabilityContent").innerHTML=`<div class="grid kpis">${kpi("Grab 시도",grabMeasured?attempts.length:"미계측",grabMeasured?"실제 controller Grip 입력":"현재 저장 세션은 계측 추가 이전 기록",grabMeasured?"":"muted")}${kpi("Grab 성공",grabMeasured?resolved.filter(e=>e.attemptOutcome==="selected").length:"미계측","selectEntered로 확인된 결과",grabMeasured?"good":"muted")}${kpi("Grab 실패",grabMeasured?resolved.filter(e=>e.attemptOutcome!=="selected").length:"미계측","관찰 가능한 outcome만 집계",grabMeasured?"bad":"muted")}${kpi("JSON 파싱 오류",invalid,"현재 필터의 무효 JSONL 행",invalid?"bad":"good")}</div><div class="grid two spacer"><article class="card"><div class="card-head"><div><h2>Grab 결과 근거</h2><p>음성 스킵 Trigger는 포함하지 않습니다.</p></div></div>${grabMeasured?`<div class="metric-bars">${outcomes.map(([name,count])=>`<div class="bar-row"><span>${esc(name)}</span><div class="bar"><i style="width:${Math.round(count/Math.max(1,resolved.length)*100)}%"></i></div><b>${count}</b></div>`).join("")}</div><button class="btn spacer" id="grabEvidence">원본 Grab 이벤트 보기</button>`:'<div class="note warn-note"><b>아직 원본 Grip 이벤트가 없습니다.</b><br>다음 Play부터 ppe_grab_attempted와 ppe_grab_attempt_resolved가 기록되며, 이전 세션에는 실패 횟수를 계산하지 않습니다.</div>'}</article><article class="card"><div class="card-head"><div><h2>음성 재생 상태</h2><p>voice_playback_ended의 실제 종료 note입니다.</p></div></div><div class="facts"><span class="fact">완료 <b class="good">${completed}</b></span><span class="fact">교체 <b class="warn">${replaced}</b></span><span class="fact">중단 <b class="bad">${stopped}</b></span><span class="fact">실제 청취시간 <b>${seconds(voice.reduce((n,e)=>n+(e.audioElapsedSec||0),0))}</b></span></div><button class="btn spacer" id="voiceEvidence">원본 음성 이벤트 보기</button></article></div>`;if($("grabEvidence"))$("grabEvidence").onclick=()=>openEvidence("ppe_grab","");$("voiceEvidence").onclick=()=>openEvidence("voice_playback","");}
function openEvidence(type="all",search="",session="all"){state.evidenceType=type;state.evidenceSearch=search;state.evidenceSession=session;switchView("evidence");}
function renderEvidence(items){
  const events=allEvents(items),parseErrors=allParseErrors(items),types=uniq(events.map(e=>e.eventType)).sort(),isParseError=state.evidenceType==="parse_error";
  let rows=isParseError?parseErrors:events;
  if(state.evidenceSession!=="all")rows=rows.filter(row=>(isParseError?row._session.sessionId:row.sessionId)===state.evidenceSession);
  if(!isParseError&&state.evidenceType!=="all")rows=rows.filter(e=>e.eventType.includes(state.evidenceType));
  if(state.evidenceSearch){const q=state.evidenceSearch.toLowerCase();rows=rows.filter(row=>JSON.stringify(row).toLowerCase().includes(q));}
  if(!isParseError)rows=rows.sort((a,b)=>String(b.timestampUtc).localeCompare(String(a.timestampUtc)));
  const shown=rows.slice(0,300),groupOptions=[
    '<option value="parse_error">JSON 파싱 오류 행</option>',
    types.some(t=>t.startsWith("ppe_grab"))||state.evidenceType==="ppe_grab"?'<option value="ppe_grab">ppe_grab_* 전체</option>':"",
    types.some(t=>t.startsWith("voice_playback"))||state.evidenceType==="voice_playback"?'<option value="voice_playback">voice_playback_* 전체</option>':""
  ].join("");
  const table=isParseError
    ?`<div class="table-wrap"><table><thead><tr><th>세션</th><th>원본 파일</th><th class="num">행 번호</th><th>파싱 오류</th><th>원본 행</th></tr></thead><tbody>${shown.map(row=>`<tr><td>${esc((row._session.sessionId||"").slice(0,8))}</td><td>${esc(row._session.sourceFile)}</td><td class="num">${row.lineNumber}</td><td>${esc(row.message)}</td><td><code>${esc(row.rawLine)}</code></td></tr>`).join("")||'<tr><td colspan="5" class="empty">현재 조건에 JSON 파싱 오류가 없습니다.</td></tr>'}</tbody></table></div>`
    :`<div class="table-wrap"><table><thead><tr><th>시각</th><th>세션</th><th>이벤트</th><th>모드·시나리오·단계</th><th>PPE</th><th>결과·근거</th></tr></thead><tbody>${shown.map(e=>`<tr><td>${fmtTime(e.timestampUtc)}</td><td>${esc((e.sessionId||"").slice(0,8))}<br><small class="muted">${esc(e.metaAppScopedUserId||e._session.metaUserId||"미식별")}</small></td><td><b>${esc(e.eventType)}</b>${e.attemptId?`<br><small class="muted">attempt ${esc(e.attemptId.slice(0,8))}</small>`:""}</td><td>${esc(e.mode||"—")} · ${esc(e.workPlan||"None")}<br><small class="muted">${esc(e.flowState||"—")}</small></td><td>${esc(e.itemType||"—")}${e.hand?`<br><small class="muted">${esc(e.hand)} · hover ${e.hoveredPpeCount}</small>`:""}</td><td>${esc(e.result||e.attemptOutcome||e.requiredPpeCheck||e.note||"—")}<br><small class="muted">${esc(e.missingRequiredPpe||e.hoveredPpeItems||"")}</small></td></tr>`).join("")||'<tr><td colspan="6" class="empty">조건에 맞는 원본 이벤트가 없습니다.</td></tr>'}</tbody></table></div>`;
  $("evidenceContent").innerHTML=`<article class="card"><div class="card-head"><div><h2>${isParseError?"JSON 파싱 오류":"원본 이벤트"} ${rows.length}건</h2><p>${isParseError?"파일명·행 번호·파서 메시지·원본 행을 그대로 표시합니다.":"최대 300행을 표시합니다. 필터로 근거를 좁혀 확인하세요."}</p></div></div><div class="raw-filter"><select id="evidenceSession"><option value="all">전체 세션</option>${items.map(s=>`<option value="${esc(s.summary.sessionId)}">${fmtTime(s.summary.startedAt)} · ${esc(s.summary.sessionId.slice(0,8))}</option>`).join("")}</select><select id="evidenceType"><option value="all">전체 이벤트</option>${groupOptions}${types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select><input id="evidenceSearch" placeholder="PPE, 시나리오, 결과, note 검색" value="${esc(state.evidenceSearch)}"></div>${table}</article>`;
  $("evidenceSession").value=state.evidenceSession;$("evidenceType").value=state.evidenceType;
  $("evidenceSession").onchange=e=>{state.evidenceSession=e.target.value;renderEvidence(items)};
  $("evidenceType").onchange=e=>{state.evidenceType=e.target.value;renderEvidence(items)};
  let timer;$("evidenceSearch").oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.evidenceSearch=e.target.value;renderEvidence(items)},180)};
}
function bindSessionRows(){document.querySelectorAll('[data-click="session"]').forEach(row=>row.onclick=()=>{state.selectedSession=row.dataset.id;switchView("sessions")});}
function bindWarnings(){document.querySelectorAll("[data-warning]").forEach(b=>b.onclick=()=>{const t=b.dataset.warning;if(t==="ended")openEvidence("session_ended");else if(t==="identity")openEvidence("meta_identity_state_changed","");else if(t==="grab")openEvidence("ppe_grab");else openEvidence("parse_error")});}
function render(){const items=filtered();$("scopeText").innerHTML=`<b>${items.length}개 세션</b> · 사용자 ${uniq(items.map(s=>s.summary.metaUserId)).length}명 · 유효 이벤트 ${items.reduce((n,s)=>n+s.summary.eventCount,0)}건`;renderOverview(items);renderSession(items);renderPeople(items);renderContent(items);renderUsability(items);renderEvidence(items);}
function switchView(view){state.view=view;document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===`view-${view}`));document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("pageTitle").textContent=pages[view][0];$("pageSubtitle").textContent=pages[view][1];if(view==="evidence")renderEvidence(filtered());window.scrollTo({top:0,behavior:"smooth"});}
document.querySelectorAll("#desktopNav button").forEach(button=>{const clone=button.cloneNode(true);$("mobileNav").appendChild(clone)});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>switchView(b.dataset.view));["userFilter","modeFilter","planFilter"].forEach(id=>$(id).onchange=e=>{state[id.replace("Filter","")]=e.target.value;render()});$("refreshButton").onclick=load;load();
</script>
