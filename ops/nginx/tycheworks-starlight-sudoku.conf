server {
    server_name starlight-sudoku.tycheworks.com;
    root /home/linuxuser/workspace/chemical-safety-vr/public/site/starlight-sudoku-landing;
    index index.html;

    include /home/linuxuser/workspace/chemical-safety-vr/ops/nginx/tycheworks-public-hardening.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.gstatic.com 'wasm-unsafe-eval' 'sha256-tZq+fEgEcWWS3XN9mc1qRUqLmNljS5s2/P7Jnbez98U=' 'sha256-/QCeUODsYNwumw/B3ojEWE3YJ7Qc4f7IJRAq4u+vL98=' 'sha256-V3MFDCuAhelaQf2+B/RKaG4nS9Gqsem+HRQJXvnA55s=' 'sha256-kpzI4FLhfdpR1OlbKF2tMTtpEyQ9X5/vhFyqFHGZ7UQ=' 'sha256-2bathqiXTRo6hukj5hnyj5xsAX/y/v9HHaF0AGYXybY=' 'sha256-ZppqV+JfNXh79yjyAEwkfUUOlwrShV0PN6u4HDGaWaU='; worker-src 'self'; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com" always;

    location = /robots.txt { alias /home/linuxuser/workspace/chemical-safety-vr/public/site/robots.txt; }
    location = /yt {
        return 302 /?utm_source=youtube&utm_medium=shorts&utm_campaign=starlight_gameplay_trailer&utm_content=trailer_v1;
    }
    location = /threads {
        return 302 /?utm_source=threads&utm_medium=social&utm_campaign=starlight_gameplay_trailer&utm_content=post_v1;
    }
    location = /store {
        return 302 https://play.google.com/store/apps/details?id=com.tychespark.starlightsudoku&utm_source=starlight_release_push&utm_medium=push&utm_campaign=launch_notification;
    }
    location ^~ /assets/ {
        alias /home/linuxuser/workspace/chemical-safety-vr/public/site/assets/;
        expires -1;
    }

    location = /api/starlight-analytics/events/batch {
        limit_except POST { deny all; }

        limit_req zone=public_site burst=20 nodelay;
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/starlight-release-push/subscriptions {
        limit_except POST { deny all; }

        limit_req zone=public_site burst=10 nodelay;
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        limit_req zone=public_site burst=60 nodelay;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tycheworks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tycheworks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name starlight-sudoku.tycheworks.com;
    return 301 https://$host$request_uri;
}
