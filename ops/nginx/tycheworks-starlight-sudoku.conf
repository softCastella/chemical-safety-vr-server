server {
    server_name starlight-sudoku.tycheworks.com;
    root /home/linuxuser/workspace/chemical-safety-vr/public/site/starlight-sudoku-landing;
    index index.html;

    include /home/linuxuser/workspace/chemical-safety-vr/ops/nginx/tycheworks-public-hardening.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location = /robots.txt { alias /home/linuxuser/workspace/chemical-safety-vr/public/site/robots.txt; }
    location ^~ /assets/ {
        alias /home/linuxuser/workspace/chemical-safety-vr/public/site/assets/;
        expires 30d;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|avif|svg|woff2?|mp3|wav)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        limit_req zone=public_site burst=60 nodelay;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tycheworks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tycheworks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name starlight-sudoku.tycheworks.com;
    return 301 https://$host$request_uri;
}
