# Include only inside the tycheworks.com HTTPS server block.
location = /app { return 301 https://loop.tycheworks.com/$is_args$args; }
location ^~ /app/ { return 301 https://loop.tycheworks.com/$is_args$args; }
location = /game { return 301 https://spark.tycheworks.com/$is_args$args; }
location ^~ /game/ { return 301 https://spark.tycheworks.com/$is_args$args; }
location = /vr { return 301 https://immersa.tycheworks.com/$is_args$args; }
location ^~ /vr/ { return 301 https://immersa.tycheworks.com/$is_args$args; }
location = /chemical-safety-vr-landing { return 301 https://chemical-safety-vr.tycheworks.com/$is_args$args; }
location ^~ /chemical-safety-vr-landing/ { return 301 https://chemical-safety-vr.tycheworks.com/$is_args$args; }
location = /brand-v2 { return 404; }
location ^~ /brand-v2/ { return 404; }
location = /immersa/chemical-safety-training-promo { return 404; }
location ^~ /immersa/chemical-safety-training-promo/ { return 404; }
