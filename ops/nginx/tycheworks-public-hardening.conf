# Include inside every public HTTPS server block after TLS is configured.
server_tokens off;
http2 on;

# Start with one day. Increase only after every served subdomain is HTTPS-ready.
add_header Strict-Transport-Security "max-age=86400" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
