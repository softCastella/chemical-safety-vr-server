# Include this file inside the immersa.tycheworks.com HTTPS server block.
# Quest Release traffic is POST-only; authenticated reads remain internal.
location ^~ /api/training-telemetry/ {
    limit_except POST { deny all; }

    limit_req zone=public_site burst=20 nodelay;
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}
